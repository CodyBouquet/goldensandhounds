# ============================================================
#  Vyrel Labs — Netlify configuration
#  Static site + access-code gate (serverless + edge function)
# ============================================================

[build]
  # The whole repo root is the site. No build step.
  publish = "."

  [build.environment]
    # Netlify's secret scanner compares env var VALUES against the build
    # output and fails the deploy on a match. These two are configuration,
    # not credentials — a from-address and the inbox that billing alerts
    # go to. Neither grants access to anything, and both legitimately
    # appear in docs and comments.
    #
    # Everything that IS a credential — RESEND_API_KEY, STRIPE_SECRET_KEY,
    # STRIPE_WEBHOOK_SECRET, PORTAL_SECRET, NETLIFY_API_TOKEN — is
    # deliberately NOT listed here and stays scanned.
    SECRETS_SCAN_OMIT_KEYS = "PORTAL_FROM,PORTAL_NOTIFY_EMAIL"

# ============================================================
#  BLOCK SERVER-SIDE SOURCE FROM BEING SERVED AS STATIC FILES
#  ------------------------------------------------------------
#  publish = "." means Netlify uploads the WHOLE repo, so without
#  these rules https://vyrellabs.com/netlify/functions/unlock.js
#  returns its own source — access codes included. Verified: it did.
#
#  `force = true` is what makes this work. Netlify serves a real file
#  on disk in preference to a redirect unless the rule is forced, so
#  dropping it silently re-opens the hole.
#
#  These must stay ABOVE the /api/* rules: rules are evaluated top
#  down, and /.netlify/functions/* is a separate internal path that
#  these patterns do not touch.
# ============================================================
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/templates/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

# Pretty URL for the unlock endpoint: /api/unlock -> the function
[[redirects]]
  from = "/api/unlock"
  to = "/.netlify/functions/unlock"
  status = 200

# ---- Client portal ----------------------------------------------
# The magic link in the sign-in email points at /portal/verify, so
# that path has to look like a real page, not a function URL.
[[redirects]]
  from = "/portal/verify"
  to = "/.netlify/functions/portal-verify"
  status = 200

[[redirects]]
  from = "/api/portal/login"
  to = "/.netlify/functions/portal-login"
  status = 200

[[redirects]]
  from = "/api/portal/logout"
  to = "/.netlify/functions/portal-logout"
  status = 200

[[redirects]]
  from = "/api/portal/me"
  to = "/.netlify/functions/portal-me"
  status = 200

[[redirects]]
  from = "/api/portal/billing"
  to = "/.netlify/functions/portal-billing"
  status = 200

[[redirects]]
  from = "/api/portal/payment-method"
  to = "/.netlify/functions/portal-payment-method"
  status = 200

[[redirects]]
  from = "/api/portal/pay"
  to = "/.netlify/functions/portal-pay"
  status = 200

[[redirects]]
  from = "/api/portal/subscription"
  to = "/.netlify/functions/portal-subscription"
  status = 200

# ---- Admin (master account) ----
# These are guarded by the admin flag inside the functions themselves,
# not by anything here. A redirect is routing, never a permission.
[[redirects]]
  from = "/api/portal/admin/clients"
  to = "/.netlify/functions/portal-admin-clients"
  status = 200

[[redirects]]
  from = "/api/portal/admin/billing"
  to = "/.netlify/functions/portal-admin-billing"
  status = 200

[[redirects]]
  from = "/api/portal/admin/requests"
  to = "/.netlify/functions/portal-admin-requests"
  status = 200

[[redirects]]
  from = "/api/portal/admin/client"
  to = "/.netlify/functions/portal-admin-client"
  status = 200

[[redirects]]
  from = "/api/portal/admin/targets"
  to = "/.netlify/functions/portal-admin-targets"
  status = 200

[[redirects]]
  from = "/api/portal/admin/target"
  to = "/.netlify/functions/portal-admin-target"
  status = 200

[[redirects]]
  from = "/api/portal/admin/person"
  to = "/.netlify/functions/portal-admin-person"
  status = 200

[[redirects]]
  from = "/api/portal/admin/activities"
  to = "/.netlify/functions/portal-admin-activities"
  status = 200

[[redirects]]
  from = "/api/portal/admin/files"
  to = "/.netlify/functions/portal-admin-files"
  status = 200

[[redirects]]
  from = "/api/portal/admin/people"
  to = "/.netlify/functions/portal-admin-people"
  status = 200

# Stripe posts here on its own schedule (renewals, failed cards).
[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# Where the Node serverless functions live
[functions]
  directory = "netlify/functions"

# Nothing under the portal should ever be cached or indexed — it's
# per-client data behind a session cookie.
[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# NOTE: Edge Functions are auto-registered from netlify/edge-functions/.
# Each declares its own path inline:
#   gate.js         -> /clients/*        (access-code gate)
#   portal-gate.js  -> /portal/account/* (portal session gate)
